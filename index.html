<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Seller TWA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --tg-clr: #2481cc; }
        body { font-family: sans-serif; background: var(--tg-theme-secondary-bg-color, #f0f0f0); color: var(--tg-theme-text-color, #000); margin: 0; padding: 15px; }
        .card { background: var(--tg-theme-bg-color, #fff); border-radius: 12px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .key-title { font-weight: bold; font-size: 14px; display: block; color: var(--tg-clr); }
        .key-sub { font-size: 12px; color: #888; margin-top: 4px; display: block; }
        .btn-gen { width: 100%; background: var(--tg-clr); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: bold; margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .status-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-top: 5px; background: #eee; }
        .active { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>

    <div class="card">
        <input type="text" id="p_name" placeholder="Название продукта">
        <input type="number" id="p_days" value="30" placeholder="Дни">
        <button class="btn-gen" onclick="generateKey()">⚡ СОЗДАТЬ НОВЫЙ КЛЮЧ</button>
    </div>

    <div id="loader" style="text-align:center;">Загрузка...</div>
    <div id="list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const API_BASE = "http://95.181.213.84:8081/api/seller";
        const SECRET = "0169484D028595B485C406FEE11F3C86F331B7823D6D10B6";
        
        // Используем бесплатный публичный прокси для обхода CORS
        const CORS_PROXY = "https://cors-anywhere.herokuapp.com/";

        async function call(path, method = 'GET', body = null) {
            const url = CORS_PROXY + API_BASE + path;
            const res = await fetch(url, {
                method: method,
                headers: {
                    'X-Seller-Key': SECRET,
                    'Content-Type': 'application/json',
                    'Origin': 'https://github.io' 
                },
                body: body ? JSON.stringify(body) : null
            });
            return await res.json();
        }

        async function load() {
            document.getElementById('loader').style.display = 'block';
            try {
                const data = await call('/keys');
                const list = document.getElementById('list');
                list.innerHTML = '';
                data.keys.reverse().forEach(k => {
                    const p = k.products[0] || {};
                    const isNew = !k.hwid;
                    const item = document.createElement('div');
                    item.className = 'card';
                    item.innerHTML = `
                        <span class="key-title">${k.license_key}</span>
                        <span class="key-sub">Продукт: ${p.name || '---'}</span>
                        <div class="status-badge ${!isNew ? 'active' : ''}">
                            ${!isNew ? 'Активирован' : 'Ожидает активации'} | ${p.days || '??'} дн.
                        </div>
                        <button onclick="deleteKey('${k.license_key}')" style="float:right; border:none; background:none; color:red;">❌</button>
                    `;
                    list.appendChild(item);
                });
            } catch(e) { alert("Ошибка доступа. Нажми кнопку 'Request Access' на cors-anywhere"); }
            document.getElementById('loader').style.display = 'none';
        }

        async function generateKey() {
            const name = document.getElementById('p_name').value;
            const days = document.getElementById('p_days').value;
            if(!name) return alert("Введите имя!");
            await call('/generate-key', 'POST', { product_name: name, days: parseInt(days) });
            load();
        }

        async function deleteKey(key) {
            if(confirm('Удалить?')) {
                await call('/delete-key', 'POST', { license_key: key });
                load();
            }
        }

        load();
    </script>
</body>
</html>
