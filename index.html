<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Amazing Fisher Admin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { 
            --bg: #ffffff; --sec-bg: #f0f2f5; --text: #1a1a1a; 
            --btn: #2481cc; --err: #e74c3c; --ok: #27ae60; --warn: #f39c12;
        }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--sec-bg); color: var(--text); margin: 0; padding: 10px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { background: var(--bg); border-radius: 14px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; background: #ddd; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: var(--btn); color: #fff; }

        .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; }
        .f-btn { padding: 6px 12px; border-radius: 20px; border: 1px solid #ccc; background: #fff; font-size: 12px; white-space: nowrap; cursor: pointer; }
        .f-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; }
        .btn-main { width: 100%; background: var(--btn); color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        #list-container, #prod-container { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media (min-width: 768px) {
            #list-container, #prod-container { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
        }

        .key-card, .prod-card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .header-row { display: flex; justify-content: space-between; align-items: center; }
        .key-code { font-family: monospace; font-weight: bold; color: var(--btn); }
        .status-badge { font-size: 10px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border-top: 1px solid #f5f5f5; padding-top: 10px; }
        .label { color: #999; display: block; font-size: 10px; text-transform: uppercase; }
        .val { font-size: 13px; font-weight: 600; }

        .hwid-box { background: #f8f9fa; padding: 8px; border-radius: 6px; font-family: monospace; font-size: 10px; color: #666; word-break: break-all; border: 1px dashed #ddd; }
        .delete-btn { background: #fff5f5; color: var(--err); border: 1px solid #ffdada; padding: 8px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        
        .hidden { display: none !important; }
        .text-right { text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-screen" style="display: none;">
        <div class="card" style="max-width: 400px; margin: auto;">
            <h3 style="text-align:center">🛡️ Admin Access</h3>
            <p id="user-display" style="font-size: 12px; text-align: center; color: #888;"></p>
            <input type="text" id="reg-key" placeholder="Secret Key (для привязки)">
            <input type="password" id="auth-pass" placeholder="Пароль">
            <button class="btn-main" onclick="handleAuth()">ВОЙТИ</button>
        </div>
    </div>

    <div id="main-content" style="display: none;">
        <div class="tabs">
            <button class="tab-btn active" id="t-keys" onclick="switchTab('keys')">КЛЮЧИ</button>
            <button class="tab-btn" id="t-prods" onclick="switchTab('prods')">ПРОДУКТЫ</button>
        </div>

        <div id="tab-keys">
            <div class="card">
                <h4>➕ Создать лицензию</h4>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="p-name" placeholder="Название продукта">
                    <input type="number" id="p-days" value="30" style="width: 90px;">
                </div>
                <button class="btn-main" onclick="generateKey()" style="margin-top:5px;">ГЕНЕРИРОВАТЬ</button>
            </div>

            <div class="filters">
                <button class="f-btn active" onclick="setFilter('all', this)">Все</button>
                <button class="f-btn" onclick="setFilter('free', this)">Свободные</button>
                <button class="f-btn" onclick="setFilter('active', this)">Активные</button>
            </div>
            <div id="list-container">Загрузка...</div>
        </div>

        <div id="tab-prods" class="hidden">
            <div class="card">
                <h4>📦 Добавленные продукты</h4>
                <p style="font-size: 11px; color: #666;">Список ваших .dll файлов на сервере</p>
            </div>
            <div id="prod-container">Загрузка...</div>
        </div>
        
        <button class="delete-btn" style="width:100%; margin-top:20px; background:#eee;" onclick="logout()">СМЕНИТЬ АККАУНТ / ВЫЙТИ</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // ПРИВЯЗКА К ID: Ключ в localStorage теперь уникален для каждого Telegram аккаунта
    const tgId = tg.initDataUnsafe?.user?.id || "default";
    const storageKey = 'app_p_' + tgId;
    let userPass = localStorage.getItem(storageKey);
    let allKeys = [];
    let currentFilter = 'all';

    window.onload = () => {
        if (tg.initDataUnsafe?.user) {
            document.getElementById('user-display').innerText = "Аккаунт: " + tg.initDataUnsafe.user.first_name;
        }
        if (!userPass) {
            document.getElementById('auth-screen').style.display = 'flex';
        } else {
            showMain();
        }
    };

    function logout() {
        localStorage.removeItem(storageKey);
        location.reload();
    }

    function switchTab(tab) {
        document.getElementById('tab-keys').classList.toggle('hidden', tab !== 'keys');
        document.getElementById('tab-prods').classList.toggle('hidden', tab !== 'prods');
        document.getElementById('t-keys').classList.toggle('active', tab === 'keys');
        document.getElementById('t-prods').classList.toggle('active', tab === 'prods');
        if (tab === 'prods') refreshProds();
    }

    async function apiRequest(path, method = 'GET', body = null) {
        const res = await fetch('/api/proxy', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: userPass, path: path, method: method, payload: body })
        });
        const data = await res.json();
        if (res.status === 401) { logout(); }
        return data;
    }

    async function handleAuth() {
        const pass = document.getElementById('auth-pass').value;
        const key = document.getElementById('reg-key').value;
        if (!pass) return;
        
        const res = await fetch('/api/proxy', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: key ? 'register' : 'login', password: pass, secret_key: key })
        });
        
        if (res.ok) { 
            localStorage.setItem(storageKey, pass); 
            userPass = pass; 
            showMain(); 
        } else { 
            alert("Ошибка входа! Проверьте пароль или Secret Key."); 
        }
    }

    function showMain() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        refreshKeys();
    }

    function setFilter(f, btn) {
        currentFilter = f;
        document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderKeys();
    }

    async function refreshKeys() {
        const container = document.getElementById('list-container');
        container.innerHTML = 'Синхронизация...';
        const res = await apiRequest('/api/seller/keys');
        if (res && res.status === "ok") {
            allKeys = res.keys;
            renderKeys();
        }
    }

    function renderKeys() {
        const container = document.getElementById('list-container');
        container.innerHTML = '';
        
        let filtered = allKeys.slice().reverse();
        if (currentFilter === 'free') filtered = filtered.filter(k => !k.hwid || k.hwid === "");
        if (currentFilter === 'active') filtered = filtered.filter(k => k.is_active);

        filtered.forEach(k => {
            const prod = k.products && k.products[0];
            const hwid = k.hwid || "ОЖИДАЕТ ПРИВЯЗКИ";
            const prodName = prod ? prod.name : "Не указан";
            
            let timeStr = "---";
            let timeColor = "color: var(--text)";
            
            if (prod && prod.expires_at && prod.expires_at > 0) {
                const diff = prod.expires_at - Math.floor(Date.now()/1000);
                if (diff <= 0) { timeStr = "ИСТЕК"; timeColor = "color:var(--err)"; }
                else if (diff < 86400) timeStr = Math.floor(diff/3600)+"ч "+Math.floor((diff%3600)/60)+"м";
                else timeStr = Math.floor(diff/86400)+" дн.";
            } else {
                const dDays = prod ? prod.duration_days : (k.duration_days || 0);
                timeStr = dDays + " дн. (запас)";
                timeColor = "color:var(--ok)";
            }

            container.innerHTML += `
                <div class="key-card">
                    <div class="header-row">
                        <span class="key-code">${k.license_key}</span>
                        <span class="status-badge" style="background:${k.is_active ? '#e6f4ea;color:#1e7e34':'#f5f5f5;color:#888'}">
                            ${k.is_active ? 'ACTIVE' : 'READY'}
                        </span>
                    </div>
                    <div class="info-grid">
                        <div><span class="label">ПРОДУКТ</span><b class="val">${prodName}</b></div>
                        <div class="text-right"><span class="label">ОСТАТОК</span><b class="val" style="${timeColor}">${timeStr}</b></div>
                    </div>
                    <div><span class="label">HWID</span><div class="hwid-box">${hwid}</div></div>
                    <button class="delete-btn" onclick="deleteKey('${k.license_key}')">УДАЛИТЬ ЛИЦЕНЗИЮ</button>
                </div>`;
        });
    }

    async function refreshProds() {
        const container = document.getElementById('prod-container');
        container.innerHTML = 'Загрузка продуктов...';
        const res = await apiRequest('/api/seller/products');
        if (res && res.products) {
            container.innerHTML = '';
            res.products.forEach(p => {
                const size = (p.file_size / 1024 / 1024).toFixed(2);
                container.innerHTML += `
                    <div class="prod-card">
                        <div class="header-row"><b>${p.name}</b> <span class="status-badge" style="background:#eef; color:#44a">FILE OK</span></div>
                        <div class="info-grid">
                            <div><span class="label">ИМЯ ФАЙЛА</span><span class="val">${p.file_name}</span></div>
                            <div class="text-right"><span class="label">РАЗМЕР</span><span class="val">${size} MB</span></div>
                        </div>
                        <button class="delete-btn" onclick="deleteProd('${p.name}')">УДАЛИТЬ ИЗ БАЗЫ</button>
                    </div>`;
            });
        }
    }

    async function generateKey() {
        const name = document.getElementById('p-name').value;
        const days = document.getElementById('p-days').value;
        if (!name) return alert("Введите продукт!");
        const res = await apiRequest('/api/seller/generate-key', 'POST', { product_name: name, days: parseInt(days) });
        if (res.status === "ok") { document.getElementById('p-name').value = ''; refreshKeys(); } 
        else alert(res.message);
    }

    async function deleteKey(k) { if(confirm('Удалить этот ключ?')) { await apiRequest('/api/seller/delete-key','POST',{license_key:k}); refreshKeys(); } }
    async function deleteProd(n) { if(confirm('ВНИМАНИЕ! Удаление продукта приведет к тому, что ВСЕ ключи этого продукта перестанут работать. Удалить?')) { await apiRequest('/api/seller/delete-product','POST',{product_name:n}); refreshProds(); } }
</script>
</body>
</html>
